name: CD Staging

# Build image (with NEXT_PUBLIC_* build-args) → scp/load on Dokploy host → trigger Dokploy webhook.
# Dokploy runs docker-compose.yml (image potta-web:latest, pull_policy: never).
# Required:
#   secrets.SSH_PRIVATE_KEY
#   vars.SERVER_IP
#   vars.DOKPLOY_WEBHOOK
#   secrets.NEXT_PUBLIC_APP_URL            e.g. https://potta.instanvi.com
#   secrets.NEXT_PUBLIC_API_BASE_URL       potta-backend public URL incl. /api/
#   secrets.NEXT_PUBLIC_AUTH_API_URL       IdP API incl. /api
#   secrets.NEXT_PUBLIC_SUPER_APP_URL      hub (instanvi-auth-frontend)
#   secrets.NEXT_PUBLIC_AUTH_PAYLOAD_SECRET  same value as the hub

on:
  push:
    branches: ["feat/pos-books-web"]
  workflow_dispatch:

env:
  IMAGE_NAME: potta-web
  IMAGE_DIR: /root/repo/instanvi-images

concurrency:
  group: cd-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set Docker image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_AUTH_API_URL=${{ secrets.NEXT_PUBLIC_AUTH_API_URL }}
            NEXT_PUBLIC_SUPER_APP_URL=${{ secrets.NEXT_PUBLIC_SUPER_APP_URL }}
            NEXT_PUBLIC_AUTH_PAYLOAD_SECRET=${{ secrets.NEXT_PUBLIC_AUTH_PAYLOAD_SECRET }}

      - name: Save Docker image as tar
        run: docker save -o ${{ env.IMAGE_NAME }}.tar ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Set up SSH connection
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Copy Docker image to server
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ vars.SERVER_IP }} "mkdir -p ${{ env.IMAGE_DIR }}"
          scp -o StrictHostKeyChecking=no ${{ env.IMAGE_NAME }}.tar root@${{ vars.SERVER_IP }}:${{ env.IMAGE_DIR }}/

      - name: Load Docker image on server
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ vars.SERVER_IP }} << EOF
          set -e
          docker load -i ${{ env.IMAGE_DIR }}/${{ env.IMAGE_NAME }}.tar
          docker tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} ${{ env.IMAGE_NAME }}:latest
          rm -f ${{ env.IMAGE_DIR }}/${{ env.IMAGE_NAME }}.tar
          EOF

      - name: Call Dokploy webhook
        run: curl -fsS -X POST "${{ vars.DOKPLOY_WEBHOOK }}"

      - name: Add job summary
        run: echo "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} deployed via Dokploy" >> "$GITHUB_STEP_SUMMARY"
